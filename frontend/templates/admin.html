<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - AI Surveillance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #1e3a8a;
            font-size: 2em;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            padding: 8px 15px;
            font-size: 14px;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 2.5em;
            font-weight: bold;
            color: #1e3a8a;
        }

        .section {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8f9fa;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            font-weight: 600;
            color: #1e3a8a;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .badge-unknown {
            background: #fee2e2;
            color: #dc2626;
        }

        .badge-known {
            background: #d1fae5;
            color: #059669;
        }

        .face-image {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Admin Dashboard</h1>
            <div>
                <a href="/" class="btn btn-primary">🏠 Back to Live Feed</a>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>📅 Unknown Faces Today</h3>
                <div class="number" id="todayCount">0</div>
            </div>
            <div class="stat-card">
                <h3>📊 Total Unknown Faces</h3>
                <div class="number" id="totalCount">0</div>
            </div>
            <div class="stat-card">
                <h3>✅ Registered Faces</h3>
                <div class="number" id="knownCount">0</div>
            </div>
            <div class="stat-card">
                <h3>🕐 Last Detection</h3>
                <div class="number" style="font-size: 1.2em;" id="lastDetection">--:--</div>
            </div>
        </div>

        <div class="section">
            <h2>🔍 Recent Detections</h2>
            <table id="detectionsTable">
                <thead>
                    <tr>
                        <th>Type</th>
                        <th>Name/Status</th>
                        <th>Date</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody id="detectionsBody">
                    <tr>
                        <td colspan="4" class="empty-state">
                            <div>Loading...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="section">
            <h2>👥 Registered Faces</h2>
            <table id="facesTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Registered On</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="facesBody">
                    <tr>
                        <td colspan="3" class="empty-state">
                            <div>Loading...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function updateDashboard() {
            // Stats fetch karo
            fetch('/api/stats')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('todayCount').textContent = data.today_count;
                        document.getElementById('totalCount').textContent = data.total_count;
                        document.getElementById('knownCount').textContent = data.known_faces_count;
                        
                        // Last detection time
                        if (data.recent_detections.length > 0) {
                            const last = data.recent_detections[0];
                            document.getElementById('lastDetection').textContent = last.time;
                        }
                        
                        // Recent detections table
                        const tbody = document.getElementById('detectionsBody');
                        tbody.innerHTML = '';
                        
                        if (data.recent_detections.length === 0) {
                            tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No detections yet</td></tr>';
                        } else {
                            data.recent_detections.forEach(detection => {
                                const row = document.createElement('tr');
                                const isUnknown = detection.type === 'unknown_face';
                                
                                row.innerHTML = `
                                    <td>
                                        <span class="badge ${isUnknown ? 'badge-unknown' : 'badge-known'}">
                                            ${isUnknown ? '❓ Unknown' : '✅ Known'}
                                        </span>
                                    </td>
                                    <td>${isUnknown ? 'Unknown Person' : detection.name}</td>
                                    <td>${detection.date}</td>
                                    <td>${detection.time}</td>
                                `;
                                
                                tbody.appendChild(row);
                            });
                        }
                    }
                })
                .catch(error => console.error('Error:', error));
            
            // Known faces fetch karo
            fetch('/api/known_faces')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const tbody = document.getElementById('facesBody');
                        tbody.innerHTML = '';
                        
                        if (data.faces.length === 0) {
                            tbody.innerHTML = '<tr><td colspan="3" class="empty-state">No registered faces yet</td></tr>';
                        } else {
                            data.faces.forEach(face => {
                                const row = document.createElement('tr');
                                const regDate = new Date(face.registered_at).toLocaleDateString('en-IN');
                                
                                row.innerHTML = `
                                    <td><strong>${face.name}</strong></td>
                                    <td>${regDate}</td>
                                    <td>
                                        <button class="btn btn-danger" onclick="deleteFace('${face.name}')">
                                            🗑️ Delete
                                        </button>
                                    </td>
                                `;
                                
                                tbody.appendChild(row);
                            });
                        }
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        function deleteFace(name) {
            if (confirm(`Are you sure you want to delete ${name}?`)) {
                fetch(`/api/delete_face/${name}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert(data.message);
                        updateDashboard();
                    } else {
                        alert('Error: ' + data.message);
                    }
                })
                .catch(error => {
                    alert('Error deleting face');
                    console.error('Error:', error);
                });
            }
        }

        // Initial load
        updateDashboard();
        
        // Auto refresh har 10 seconds
        setInterval(updateDashboard, 10000);
    </script>
</body>
</html>
